    <script>
      // Clean up legacy ping tool caches from previous applet instances
      if ('caches' in window) {
        caches.keys().then(function(names) {
          var cleared = false;
          names.forEach(function(name) {
            if (name === 'ping-tool-v1' || name.indexOf('ping') !== -1) {
              caches.delete(name);
              cleared = true;
            }
          });
          if (cleared) {
            console.log('Legacy ping cache cleared');
          }
        });
      }
    </script>
